education:
    - degree: Network Information Systems Architecture
      university: 42 School Paris
      time: 2019 - current
      details: |
        At 42 we learn computer programming to hands on projects. The first 2 years projects are almost entirely written in C,
        we learn memory management, parallel computing, algorithms and data structures.
        We then learn OOP and networking with C++. Followed by full stack in typescript. After that the topic of projects are more individual so we can specialize in the field of our choice.
        For the degree we focus on:
        - Creating software that will handle the fundamentals of an operating system through an interface
        - Using parallel and concurrent programming
        - Carrying out a network architecture project
        - Implementing an I.P. network architecture through an understanding and application of the principles of connection between machines
        - Configuring an operating system
        - Providing security within the structure
    - degree: BSc in Audio Engineering
      university: SAE Institute Berlin
      time: 2010 - 2013
      details: |
        During this Bachelor Degree we learn the fundamentals of Audio Engineering as well as Music Industry. We learn about Mixing, Mastering, Music and using recording tools (equalizers, compressors, microphones, speakers). We had courses on Business and Marketing, Copyright law, 
        as well as maintenance and repair of audio equipment.
