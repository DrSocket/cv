projects:
    title: Projects
    intro: >
      These are some of the projects that I completed during my studies at 42. The projects are available on github with a full description.
    assignments:
      - title: Transcendence (NestJS, Vue.js, Postgres, Docker)
        link: "#hook"
        tagline: "A single-page application built in Typescript and Deployed using Docker. Backend using NestJS, Frontend using Vue.js. Postgres db with TypeORM. 
        The web application offers a multiplayer pong game and full featured chat service making use of Websockets."

      - title: Containers (C++)
        link: "#"
        tagline: "For this project I implemented a few of the containers from the C++ STL. These include: vector, map, stack and set. The purpose was to better understand
        C++ STL and using Templates in general as well as complexity."

      - title: IRC Server (C++)
        link: "#"
        tagline: "The purpose of this project was to learn socket programming as well as understanding the reference (RFC) for the irc chat protocol.
        The client used as reference is irssi."

      - title: Cub3d
        link: "#"
        tagline: "A graphics project, the purpose was to learn raycasting and understand the inner workings of graphical engines."

      - title: Linear Regression
        link: "#"
        tagline: "This project is an intro into AI and Machine Learning by creating a basic machine learning algorithm.
        It is a program that predicts the price of a car by using a linear function train with a gradient descent algorithm."

