career-profile:
    title: Profile
    summary: |
      Currently a student at 42 School Paris, I am looking for an end-of-study internship to have real-world software engineering experience. 
      A 4-6 month internship is necessary as part of my MSc degree in Network Information Systems Architecture.
education:
    - degree: Network Information Systems Architecture
      university: 42 School Paris
      time: 2019 - current
      details: |
        At 42 I learnt software engineering with hands on projects. I began the studies coding in C,
         memory, then moved on to memory management, parallel computing, algorithms and data structures.
        I then learnt OOP and networking with C++, followed by full stack in typescript. After that the choice of projects is more individual as long as they fullfil certain requirements.
        For the degree I chose I am focusing on:
        - Creating software that will handle the fundamentals of an operating system through an interface
        - Using parallel and concurrent programming
        - Carrying out a network architecture project
        - Implementing an I.P. network architecture through an understanding and application of the principles of connection between machines
        - Configuring an operating system
        - Providing security within the structure
    - degree: BSc in Audio Engineering
      university: SAE Institute Berlin
      time: 2010 - 2013
      details: |
        During this Bachelor Degree I learnt the fundamentals of Audio Engineering as well as Music Industry. I learnt about Mixing, Mastering, Music and using recording tools (equalizers, compressors, microphones, speakers). 
        I also attended courses on Business and Marketing, Copyright law, as well as maintenance and repair of audio equipment, which entails soldering and circuit boards.
experiences:
    details: |
      Travelling was a big part of my childhood and early adult life, I started working in Mexico my home country at 18 as a personal tour guide, selling and guiding the tours.
      Through this experience I was able to come in contact with people from various countries and different social economic backgrounds. In my early 20s I moved to Barcelona and then Berlin
      to pursue and further my studies in Audio Engineering. During my studies I became interested in Eastern philosophy, meditation and yoga which led me upon completion to travel to India 
      and south east Asia where I spent the next several years studying local traditional techniques, this led me to teach Yoga for the last few years with the blessing of my teacher.

