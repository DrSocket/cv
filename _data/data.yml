career-profile:
    title: Profile
    summary: |
      Currently a student at 42 School Paris, I am looking for an end-of-study internship to have real-world software engineering experience. 
      A 4-6 month internship is a necessary as part of my MSc degree in Network Information Systems Architecture.
education:
    - degree: Network Information Systems Architecture
      university: 42 School Paris
      time: 2019 - current
      details: |
        At 42 we learn software engineering with hands on projects. We begin the studies coding in C,
        we learn memory management, parallel computing, algorithms and data structures.
        We then learn OOP and networking with C++. Followed by full stack in typescript. After that the topic of projects are more individual so we can specialize in the field of our choice.
        For the degree I chose we focus on:
        - Creating software that will handle the fundamentals of an operating system through an interface
        - Using parallel and concurrent programming
        - Carrying out a network architecture project
        - Implementing an I.P. network architecture through an understanding and application of the principles of connection between machines
        - Configuring an operating system
        - Providing security within the structure
    - degree: BSc in Audio Engineering
      university: SAE Institute Berlin
      time: 2010 - 2013
      details: |
        During this Bachelor Degree we learn the fundamentals of Audio Engineering as well as Music Industry. We learn about Mixing, Mastering, Music and using recording tools (equalizers, compressors, microphones, speakers). 
        We also had courses on Business and Marketing, Copyright law, as well as maintenance and repair of audio equipment, this entails soldering and circuit boards.
